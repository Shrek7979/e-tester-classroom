<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>몬테카를로 원주율 시뮬레이터</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#d7ddea; --blue:#2563eb; --red:#ef4444; --panel:#fff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:32px 18px; color:var(--ink); background:linear-gradient(135deg,#eef4ff,#f8fafc 45%,#fff7ed); font-family:Inter,"Noto Sans KR",system-ui,sans-serif; }
    main { width:min(1100px,100%); margin:auto; }
    header { margin-bottom:22px; }
    h1 { margin:0 0 8px; font-size:clamp(1.65rem,4vw,2.5rem); letter-spacing:-.04em; }
    header p { margin:0; color:var(--muted); line-height:1.7; }
    .controls,.card { background:rgba(255,255,255,.9); border:1px solid rgba(215,221,234,.9); border-radius:18px; box-shadow:0 12px 35px rgba(31,41,55,.08); }
    .controls { display:grid; grid-template-columns:1fr 1fr 1.2fr auto; gap:14px; padding:18px; margin-bottom:18px; align-items:end; }
    label { display:grid; gap:7px; font-size:.86rem; font-weight:700; }
    input { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; color:var(--ink); background:#fff; font:inherit; }
    input:focus { outline:3px solid #bfdbfe; border-color:var(--blue); }
    button { border:0; border-radius:10px; padding:12px 22px; color:#fff; background:var(--ink); font:inherit; font-weight:800; cursor:pointer; transition:.15s; }
    button:hover { background:var(--blue); transform:translateY(-1px); }
    button:disabled { opacity:.55; cursor:wait; transform:none; }
    .actions { display:flex; gap:8px; }
    #stop { background:#64748b; min-width:76px; }
    #restart { background:#2563eb; min-width:96px; }
    input[type="range"] { padding:0; accent-color:var(--blue); }
    .speed-value { color:var(--blue); font-variant-numeric:tabular-nums; }
    .grid { display:grid; grid-template-columns:minmax(300px,1.25fr) minmax(260px,.75fr); gap:18px; }
    .card { padding:18px; }
    .plot { aspect-ratio:1; padding:0; overflow:hidden; background:#fff; }
    canvas { display:block; width:100%; height:100%; }
    .stats { display:grid; gap:12px; align-content:start; }
    .stat { padding:17px; border-radius:14px; background:#f8fafc; border:1px solid #e8ecf3; }
    .stat span { display:block; color:var(--muted); font-size:.84rem; margin-bottom:7px; }
    .stat strong { font-size:clamp(1.25rem,3vw,1.75rem); font-variant-numeric:tabular-nums; }
    .formula { padding:16px; border-radius:14px; color:#1e3a8a; background:#eff6ff; line-height:1.7; font-size:.93rem; }
    .legend { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:.86rem; }
    .dot { display:inline-block; width:9px; height:9px; margin-right:6px; border-radius:50%; }
    #status { min-height:1.4em; margin:0; color:var(--muted); font-size:.82rem; }
    @media (max-width:760px) { .controls,.grid { grid-template-columns:1fr; } button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>몬테카를로 원주율 시뮬레이터</h1>
      <p>정사각형 안에 난수를 뿌리고 단위원에 들어간 점의 비율로 π를 추정합니다.</p>
    </header>

    <section class="controls" aria-label="시뮬레이션 설정">
      <label>점의 수 N
        <input id="count" type="number" min="100" max="10000000" step="100" value="100000" inputmode="numeric" />
      </label>
      <label>난수 시드
        <input id="seed" type="text" value="codex-2026" maxlength="100" />
      </label>
      <label>점 찍는 속도 <span id="speedValue" class="speed-value">보통 · 초당 2,000개</span>
        <input id="speed" type="range" min="0" max="100" value="40" aria-label="점 찍는 속도" />
      </label>
      <div class="actions">
        <button id="start" type="button">시작</button>
        <button id="stop" type="button" disabled>정지</button>
        <button id="restart" type="button">새로 시작</button>
      </div>
    </section>

    <section class="grid">
      <div class="card plot"><canvas id="plot" aria-label="단위원 안과 밖의 점 산점도"></canvas></div>
      <aside class="card stats" aria-live="polite">
        <div class="legend"><span><i class="dot" style="background:#2563eb"></i>원 안</span><span><i class="dot" style="background:#ef4444"></i>원 밖</span></div>
        <div class="stat"><span>원 안의 점 Sₙ</span><strong id="inside">—</strong></div>
        <div class="stat"><span>원 안의 점 비율 Sₙ / N</span><strong id="ratio">—</strong></div>
        <div class="stat"><span>원주율 추정값 4Sₙ / N</span><strong id="estimate">—</strong></div>
        <div class="stat"><span>실제 π와의 절대 오차</span><strong id="error">—</strong></div>
        <div class="formula">판정식: x² + y² ≤ 1<br />추정식: π ≈ 4 × Sₙ / N</div>
        <p id="status"></p>
      </aside>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const canvas = $('plot'), ctx = canvas.getContext('2d');
    let lastPoints = [], animationId = 0, state = null;

    function hashSeed(text) {
      let h = 2166136261;
      for (let i=0;i<text.length;i++) { h ^= text.charCodeAt(i); h = Math.imul(h,16777619); }
      return h >>> 0;
    }
    function mulberry32(a) {
      return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15,1 | a); t = t + Math.imul(t ^ t >>> 7,61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    }
    function resize() {
      const box = canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1,2);
      canvas.width = Math.round(box.width*dpr); canvas.height = Math.round(box.height*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0); draw(box.width,box.height);
    }
    function draw(w=canvas.clientWidth,h=canvas.clientHeight) {
      ctx.clearRect(0,0,w,h); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle='#cbd5e1'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
      ctx.strokeStyle='#172033'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(w/2,h/2,Math.min(w,h)/2-2,0,Math.PI*2); ctx.stroke();
      const size = lastPoints.length > 20000 ? 1 : 1.6;
      for (const p of lastPoints) { ctx.fillStyle=p[2]?'rgba(37,99,235,.55)':'rgba(239,68,68,.55)'; ctx.fillRect((p[0]+1)*w/2-size/2,(1-p[1])*h/2-size/2,size,size); }
    }
    const nf = new Intl.NumberFormat('ko-KR');
    function pointsPerSecond() { return Math.round(100 * Math.pow(10, Number($('speed').value) / 25)); }
    function updateSpeedLabel() {
      const speed = pointsPerSecond(), level = speed < 600 ? '느리게' : speed < 10000 ? '보통' : speed < 150000 ? '빠르게' : '매우 빠르게';
      $('speedValue').textContent = `${level} · 초당 ${nf.format(speed)}개`;
    }
    function updateStats(s) {
      const ratio = s.done ? s.inside/s.done : 0, estimate=4*ratio, error=Math.abs(Math.PI-estimate);
      $('inside').textContent=nf.format(s.inside); $('ratio').textContent=ratio.toFixed(8); $('estimate').textContent=estimate.toFixed(8); $('error').textContent=error.toFixed(8);
      $('status').textContent=`${nf.format(s.done)} / ${nf.format(s.n)}개 (${(s.done/s.n*100).toFixed(1)}%)`;
    }
    function animate(now) {
      if (!state || state.paused) return;
      if (!state.lastTime) state.lastTime=now;
      const elapsed=Math.min((now-state.lastTime)/1000,.1); state.lastTime=now;
      state.carry += elapsed*pointsPerSecond();
      let batch=Math.min(state.n-state.done,Math.floor(state.carry),50000); state.carry-=batch;
      for (let i=0;i<batch;i++) {
        const x=state.random()*2-1,y=state.random()*2-1,isInside=x*x+y*y<=1; if(isInside) state.inside++; state.done++;
        if (lastPoints.length<60000) lastPoints.push([x,y,isInside]); else if (state.random()<60000/state.done) lastPoints[Math.floor(state.random()*60000)]=[x,y,isInside];
      }
      updateStats(state); draw();
      if (state.done>=state.n) { $('status').textContent=`완료 · 총 ${nf.format(state.n)}개${state.n>60000?' (산점도는 60,000개 표본)':''}`; $('stop').disabled=true; $('start').disabled=true; state=null; return; }
      animationId=requestAnimationFrame(animate);
    }
    function resetAndStart() {
      const n = Math.floor(Number($('count').value)), seed = $('seed').value;
      if (!Number.isFinite(n) || n<100 || n>10000000) { $('status').textContent='점의 수는 100~10,000,000 사이로 입력해 주세요.'; return; }
      cancelAnimationFrame(animationId); lastPoints=[];
      state={n,done:0,inside:0,random:mulberry32(hashSeed(seed)),paused:false,lastTime:0,carry:1};
      $('start').disabled=true; $('start').textContent='시작'; $('stop').disabled=false; draw(); updateStats(state);
      animationId=requestAnimationFrame(animate);
    }
    function startOrResume() {
      if (!state) { resetAndStart(); return; }
      if (state.paused) { state.paused=false; state.lastTime=0; $('start').disabled=true; $('start').textContent='시작'; $('stop').disabled=false; animationId=requestAnimationFrame(animate); }
    }
    $('start').addEventListener('click',startOrResume);
    $('stop').addEventListener('click',()=>{
      if(!state || state.paused) return; state.paused=true; cancelAnimationFrame(animationId);
      $('start').disabled=false; $('start').textContent='계속하기'; $('stop').disabled=true;
      $('status').textContent=`정지 · ${nf.format(state.done)} / ${nf.format(state.n)}개`;
    });
    $('restart').addEventListener('click',resetAndStart);
    $('speed').addEventListener('input',updateSpeedLabel);
    $('count').addEventListener('keydown',e=>{ if(e.key==='Enter') resetAndStart(); });
    $('seed').addEventListener('keydown',e=>{ if(e.key==='Enter') resetAndStart(); });
    new ResizeObserver(resize).observe(canvas); updateSpeedLabel(); draw(); $('status').textContent='설정을 선택한 뒤 시작 버튼을 눌러 주세요.';
  </script>
</body>
</html>
