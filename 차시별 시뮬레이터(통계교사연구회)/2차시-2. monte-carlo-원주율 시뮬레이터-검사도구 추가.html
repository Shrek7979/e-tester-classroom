<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몬테카를로 원주율 시뮬레이터</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px 16px;background:#f1f5f9;color:#172033;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto}h1{margin:0 0 8px}p{color:#64748b}.panel{background:#fff;border:1px solid #dbe2ec;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 8px 25px #33415512}.controls{display:grid;grid-template-columns:1fr 1fr 1.3fr auto;gap:12px;align-items:end}label{display:grid;gap:6px;font-size:13px;font-weight:700}input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}input[type=range]{padding:0;accent-color:#2563eb}button{padding:11px 16px;border:0;border-radius:9px;background:#172033;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.actions{display:flex;gap:7px}#stop{background:#64748b}#restart,#runBatch{background:#2563eb}.main-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.plot{padding:0;overflow:hidden;aspect-ratio:1}canvas{display:block;width:100%;height:100%}.stats{display:grid;gap:10px}.stat{padding:13px;background:#f8fafc;border-radius:10px}.stat span{display:block;color:#64748b;font-size:13px}.stat strong{font-size:22px;font-variant-numeric:tabular-nums}.batch-controls{display:grid;grid-template-columns:1.5fr .7fr 1fr auto;gap:12px;align-items:end}table{width:100%;margin-top:16px;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:#64748b}.hist{margin-top:16px}#histogram{height:auto}#status,#batchStatus{font-size:13px;color:#64748b}@media(max-width:760px){.controls,.main-grid,.batch-controls{grid-template-columns:1fr}.actions button{flex:1}.table-wrap{overflow-x:auto}}</style></head><body><main>
<h1>몬테카를로 원주율 시뮬레이터</h1><p>정사각형에 난수를 순차적으로 표시하고 단위원 내부의 비율로 π를 추정합니다.</p>
<section class="panel controls"><label>점의 수 N<input id="count" type="number" min="100" max="10000000" value="100000"></label><label>난수 시드<input id="seed" value="codex-2026"></label><label>점 찍는 속도 <span id="speedText">초당 2,000개</span><input id="speed" type="range" min="0" max="100" value="40"></label><div class="actions"><button id="start">시작</button><button id="stop" disabled>정지</button><button id="restart">새로 시작</button></div></section>
<section class="main-grid"><div class="panel plot"><canvas id="plot"></canvas></div><aside class="panel stats"><div class="stat"><span>원 안의 점 Sₙ</span><strong id="inside">—</strong></div><div class="stat"><span>원 안의 점 비율 Sₙ/N</span><strong id="ratio">—</strong></div><div class="stat"><span>원주율 추정값 4Sₙ/N</span><strong id="estimate">—</strong></div><div class="stat"><span>실제 π와 절대 오차</span><strong id="error">—</strong></div><p id="status">설정 후 시작 버튼을 눌러 주세요.</p></aside></section>
<section class="panel"><h2>배치 반복 분석</h2><p>여러 N 조건에서 M회 반복한 추정값의 분포와 정확도를 비교합니다.</p><div class="batch-controls"><label>N 조건 (쉼표 구분)<input id="batchCounts" value="1000, 10000, 100000"></label><label>반복 횟수 M<input id="repeats" type="number" min="2" max="1000" value="100"></label><label>배치 시드<input id="batchSeed" value="batch-2026"></label><button id="runBatch">배치 분석 실행</button></div><div class="table-wrap"><table><thead><tr><th>N</th><th>M</th><th>평균</th><th>표준편차</th><th>평균 절대오차</th></tr></thead><tbody id="batchBody"><tr><td colspan="5" style="text-align:center">분석 전</td></tr></tbody></table></div><div class="hist"><canvas id="histogram" width="1000" height="400"></canvas></div><p id="batchStatus">조건을 입력한 뒤 실행해 주세요.</p></section>
</main><script>
const $=x=>document.getElementById(x),nf=new Intl.NumberFormat('ko-KR'),canvas=$('plot'),ctx=canvas.getContext('2d');let points=[],state=null,aid=0;
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function speed(){return Math.round(100*10**(+$('speed').value/25))}function speedLabel(){$('speedText').textContent=`초당 ${nf.format(speed())}개`}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,d=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#172033';ctx.lineWidth=2;ctx.beginPath();ctx.arc(w/2,h/2,Math.min(w,h)/2-2,0,Math.PI*2);ctx.stroke();for(const p of points){ctx.fillStyle=p[2]?'#2563eb88':'#ef444488';ctx.fillRect((p[0]+1)*w/2,(1-p[1])*h/2,1.5,1.5)}}
function stats(){let q=state.done?state.inside/state.done:0;$('inside').textContent=nf.format(state.inside);$('ratio').textContent=q.toFixed(8);$('estimate').textContent=(4*q).toFixed(8);$('error').textContent=Math.abs(Math.PI-4*q).toFixed(8);$('status').textContent=`${nf.format(state.done)} / ${nf.format(state.n)}개`}
function frame(t){if(!state||state.paused)return;if(!state.last)state.last=t;state.carry+=Math.min((t-state.last)/1000,.1)*speed();state.last=t;let b=Math.min(state.n-state.done,Math.floor(state.carry),50000);state.carry-=b;while(b--){let x=state.r()*2-1,y=state.r()*2-1,z=x*x+y*y<=1;state.inside+=z;state.done++;if(points.length<60000)points.push([x,y,z]);else if(state.r()<60000/state.done)points[Math.floor(state.r()*60000)]=[x,y,z]}stats();draw();if(state.done>=state.n){$('status').textContent=`완료 · ${nf.format(state.n)}개`;$('stop').disabled=true;state=null;return}aid=requestAnimationFrame(frame)}
function reset(){let n=Math.floor(+$('count').value);if(n<100||n>1e7)return alert('N은 100~10,000,000으로 입력하세요.');cancelAnimationFrame(aid);points=[];state={n,done:0,inside:0,r:rng(hash($('seed').value)),paused:false,last:0,carry:1};$('start').disabled=true;$('start').textContent='시작';$('stop').disabled=false;stats();draw();aid=requestAnimationFrame(frame)}
$('start').onclick=()=>{if(!state)return reset();state.paused=false;state.last=0;$('start').disabled=true;$('start').textContent='시작';$('stop').disabled=false;aid=requestAnimationFrame(frame)};$('stop').onclick=()=>{if(!state)return;state.paused=true;cancelAnimationFrame(aid);$('start').disabled=false;$('start').textContent='계속하기';$('stop').disabled=true;$('status').textContent='정지됨'};$('restart').onclick=reset;$('speed').oninput=speedLabel;
function hist(rs){let c=$('histogram'),g=c.getContext('2d'),rh=140;c.height=rs.length*rh+20;g.clearRect(0,0,c.width,c.height);rs.forEach((r,k)=>{let top=k*rh+20,L=90,W=870,sp=Math.max(...r.v.map(x=>Math.abs(x-Math.PI)),.001),lo=Math.PI-sp*1.1,hi=Math.PI+sp*1.1,b=24,a=Array(b).fill(0);r.v.forEach(x=>a[Math.min(b-1,Math.max(0,Math.floor((x-lo)/(hi-lo)*b)))]++);let peak=Math.max(...a);g.fillStyle='#172033';g.font='14px system-ui';g.textAlign='right';g.fillText(`N=${nf.format(r.n)}`,L-10,top+20);g.fillStyle=['#2563eb','#7c3aed','#ea580c','#059669'][k%4];a.forEach((x,i)=>g.fillRect(L+i*W/b,top+100-x/peak*85,W/b-2,x/peak*85));g.strokeStyle='#172033';let px=L+(Math.PI-lo)/(hi-lo)*W;g.beginPath();g.moveTo(px,top);g.lineTo(px,top+100);g.stroke()})}
function batch(){let ns=$('batchCounts').value.split(',').map(x=>Math.floor(+x.trim())).filter(x=>x>=10&&x<=1e7),m=Math.floor(+$('repeats').value);if(!ns.length||ns.length>5||m<2||m>1000)return $('batchStatus').textContent='N은 최대 5개, M은 2~1,000으로 입력하세요.';let total=ns.reduce((a,n)=>a+n*m,0);if(total>1e8)return $('batchStatus').textContent='총 계산량을 100,000,000 이하로 줄여 주세요.';$('runBatch').disabled=true;let r=rng(hash($('batchSeed').value)),rs=ns.map(n=>({n,v:[]})),ci=0,ri=0,p=0,inn=0,done=0;function work(){let budget=7e5;while(ci<rs.length&&budget){let n=rs[ci].n,t=Math.min(budget,n-p);for(let i=0;i<t;i++){let x=r()*2-1,y=r()*2-1;inn+=x*x+y*y<=1}p+=t;done+=t;budget-=t;if(p===n){rs[ci].v.push(4*inn/n);p=inn=0;if(++ri===m){ci++;ri=0}}}$('batchStatus').textContent=`계산 중 ${(done/total*100).toFixed(1)}%`;if(ci<rs.length)return requestAnimationFrame(work);rs.forEach(x=>{x.mean=x.v.reduce((a,b)=>a+b)/m;x.sd=Math.sqrt(x.v.reduce((a,b)=>a+(b-x.mean)**2,0)/(m-1));x.mae=x.v.reduce((a,b)=>a+Math.abs(b-Math.PI),0)/m});$('batchBody').innerHTML=rs.map(x=>`<tr><td>${nf.format(x.n)}</td><td>${m}</td><td>${x.mean.toFixed(8)}</td><td>${x.sd.toFixed(8)}</td><td>${x.mae.toFixed(8)}</td></tr>`).join('');hist(rs);$('batchStatus').textContent='완료';$('runBatch').disabled=false}requestAnimationFrame(work)}$('runBatch').onclick=batch;new ResizeObserver(draw).observe(canvas);speedLabel();draw();
</script></body></html>
