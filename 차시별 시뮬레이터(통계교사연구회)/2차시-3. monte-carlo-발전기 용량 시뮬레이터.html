<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발전기 용량 몬테카를로</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:#f4f7fb;color:#172033;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto}h1{margin:0}p{color:#64748b}.card,.stat,.chart{background:#fff;border:1px solid #dbe2ec;border-radius:14px;padding:16px;margin:14px 0}.controls{display:grid;grid-template-columns:repeat(4,1fr) auto auto;gap:10px;align-items:end}label{display:grid;gap:6px;font-size:13px;font-weight:700}input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}input[type=range]{padding:0}button{padding:11px 16px;border:0;border-radius:8px;background:#172033;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.45}#pause{background:#64748b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{margin:0}.stat span{display:block;color:#64748b;font-size:12px}.stat strong{font-size:23px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chart{margin:14px 0}.chart h2{font-size:18px}canvas{display:block;width:100%;height:auto}.ok{color:#047857}.bad{color:#dc2626}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:760px){.controls,.stats,.charts{grid-template-columns:1fr}}</style></head><body><main><h1>발전기 용량 몬테카를로 시뮬레이터</h1><p>30개 부스의 총전력을 한 행사씩 순차적으로 생성합니다.</p><section class="card controls"><label>용량 B<input id="B" type="number" value="52" min="30" max="90"></label><label>반복 M<input id="M" type="number" value="20000" min="100" max="1000000"></label><label>시드<input id="seed" value="iasa-2026"></label><label>속도 <span id="speedText"></span><input id="speed" type="range" min="0" max="100" value="50"></label><button id="start">새로 시작</button><button id="pause" disabled>정지</button></section><p id="status">새로 시작 버튼을 눌러 주세요.</p><section class="stats"><div class="stat"><span>정상 운영 횟수</span><strong id="success">—</strong></div><div class="stat"><span>정상 운영 확률</span><strong id="prob">—</strong></div><div class="stat"><span>95% 최소 용량</span><strong id="minB">—</strong></div><div class="stat"><span>선택 용량 판정</span><strong id="decision">—</strong></div></section><section class="charts"><div class="chart"><h2>총전력 히스토그램</h2><canvas id="hist" width="600" height="360"></canvas></div><div class="chart"><h2>용량별 정상 운영 확률</h2><canvas id="curve" width="600" height="360"></canvas></div></section><section class="card"><h2>반복 횟수별 비교</h2><table><thead><tr><th>M</th><th>선택 B의 확률</th><th>95% 최소 B</th></tr></thead><tbody id="compare"><tr><td colspan="3" style="text-align:center">주 시뮬레이션 완료 후 표시</td></tr></tbody></table><p>E(C)=1.5, V(C)=0.45, E(T)=45, SD(T)=√13.5≈3.674</p></section></main><script>
const $=x=>document.getElementById(x),fmt=new Intl.NumberFormat('ko-KR');function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt();h=Math.imul(h,16777619)}return h>>>0}function random(a){return()=>{a|=0;a=a+1831565813|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function sampleOne(r){let t=0;for(let i=0;i<30;i++){let u=r();t+=u<.6?1:u<.9?2:3}return t}function cdf(f,total){let a=[],s=0;for(let i=0;i<f.length;i++){s+=f[i];a[i]=total?s/total:0}return a}function minimum(c){for(let i=0;i<c.length;i++)if(c[i]>=.95)return i;return 90}
function hist(f,B){let c=$('hist'),g=c.getContext('2d'),w=c.width,h=c.height,L=40,base=h-35,lo=30,hi=65,max=Math.max(1,...f);g.clearRect(0,0,w,h);g.strokeStyle='#cbd5e1';g.beginPath();g.moveTo(L,10);g.lineTo(L,base);g.lineTo(w-10,base);g.stroke();let bw=(w-L-12)/(hi-lo+1);for(let x=lo;x<=hi;x++){let bh=f[x]/max*(base-25);g.fillStyle=x<=B?'#2563eb':'#ef4444';g.fillRect(L+(x-lo)*bw,base-bh,bw-2,bh);if(x%5===0){g.fillStyle='#64748b';g.font='12px system-ui';g.textAlign='center';g.fillText(x,L+(x-lo+.5)*bw,base+18)}}}
function curve(c,B,mb){let v=$('curve'),g=v.getContext('2d'),w=v.width,h=v.height,L=45,base=h-35,lo=38,hi=60,X=x=>L+(x-lo)/(hi-lo)*(w-L-15),Y=y=>base-y*(base-20);g.clearRect(0,0,w,h);g.strokeStyle='#ef4444';g.setLineDash([6,5]);g.beginPath();g.moveTo(L,Y(.95));g.lineTo(w-10,Y(.95));g.stroke();g.setLineDash([]);g.strokeStyle='#2563eb';g.lineWidth=3;g.beginPath();for(let x=lo;x<=hi;x++)x===lo?g.moveTo(X(x),Y(c[x])):g.lineTo(X(x),Y(c[x]));g.stroke();g.fillStyle='#172033';g.beginPath();g.arc(X(B),Y(c[B]),5,0,7);g.fill();g.font='12px system-ui';g.fillText('95%',8,Y(.95)+4);g.fillText(`최소 B=${mb}`,X(mb)-20,Y(c[mb])-10)}
let job=null,raf=0;const rate=()=>Math.round(20*10**(+$('speed').value/25));function speedText(){$('speedText').textContent=`초당 ${fmt.format(rate())}회`}function show(){let c=cdf(job.f,job.done),p=c[job.B],mb=minimum(c);$('success').textContent=fmt.format(job.ok);$('prob').textContent=(p*100).toFixed(2)+'%';$('minB').textContent=mb+' 단위';$('decision').textContent=p>=.95?'기준 충족':'기준 미달';$('decision').className=p>=.95?'ok':'bad';$('status').textContent=`${fmt.format(job.done)} / ${fmt.format(job.M)}회 (${(job.done/job.M*100).toFixed(1)}%)`;hist(job.f,job.B);curve(c,job.B,mb)}function fixed(M,B,seed){let r=random(hash(seed)),f=Array(91).fill(0);for(let i=0;i<M;i++)f[sampleOne(r)]++;let c=cdf(f,M);return[c[B],minimum(c)]}
function finish(){show();let{B,M,seed}=job;$('compare').innerHTML=[1000,5000,20000].map(m=>{let x=fixed(m,B,seed+m);return`<tr><td>${fmt.format(m)}</td><td>${(x[0]*100).toFixed(2)}%</td><td>${x[1]}</td></tr>`}).join('');$('status').textContent=`완료 · ${fmt.format(M)}회`;$('pause').disabled=true;job=null}function tick(t){if(!job||job.paused)return;if(!job.last)job.last=t;job.carry+=Math.min((t-job.last)/1000,.1)*rate();job.last=t;let n=Math.min(job.M-job.done,Math.floor(job.carry),3000);job.carry-=n;while(n--){let x=sampleOne(job.r);job.f[x]++;job.done++;job.ok+=x<=job.B}if(t-job.draw>80||job.done===job.M){show();job.draw=t}if(job.done===job.M)return finish();raf=requestAnimationFrame(tick)}function start(){let B=Math.floor(+$('B').value),M=Math.floor(+$('M').value);if(B<30||B>90||M<100||M>1e6)return alert('B는 30~90, M은 100~1,000,000으로 입력하세요.');cancelAnimationFrame(raf);job={B,M,seed:$('seed').value,r:random(hash($('seed').value)),f:Array(91).fill(0),done:0,ok:0,carry:1,last:0,draw:0,paused:false};$('pause').disabled=false;$('pause').textContent='정지';$('status').textContent='시작…';raf=requestAnimationFrame(tick)}$('start').onclick=start;$('pause').onclick=()=>{if(!job)return;job.paused=!job.paused;$('pause').textContent=job.paused?'계속하기':'정지';if(job.paused)cancelAnimationFrame(raf);else{job.last=0;raf=requestAnimationFrame(tick)}};$('speed').oninput=speedText;speedText();
</script></body></html>
